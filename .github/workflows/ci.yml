name: "CI - Primeira integração"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  exemplo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ver o artefato
        run: ls -lh target/*.jar

      - name: Build
        run: mvn -B -DskipTests package

      - name: Ver o Java do runner
        run: java -version